name: Deploy 3D Engine to Hugging Face
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish-3d-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging/zerogpu-engines-v0.1
      - name: Validate deployment files
        shell: bash
        run: |
          set -euo pipefail
          test -f 3d-engine/README.md
          test -f 3d-engine/app.py
          test -f 3d-engine/requirements.txt
          grep -q '^sdk: gradio$' 3d-engine/README.md
          python -m py_compile 3d-engine/app.py
      - name: Require Hugging Face write token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::Add a write-scoped HF_TOKEN in repository Actions secrets. Do not paste tokens in source files."
            exit 1
          fi
      - name: Install Hugging Face Hub CLI
        run: python -m pip install --disable-pip-version-check 'huggingface_hub>=0.34,<2'
      - name: Upload Gradio Space files
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          hf upload hoanggiakt/hoanggia-3d-engine ./3d-engine . --repo-type space --token "$HF_TOKEN" --commit-message "Deploy HOANGGIA 3D Engine Gradio staging" --exclude "**/__pycache__/**"
      - name: Report Space URL
        run: echo "https://huggingface.co/spaces/hoanggiakt/hoanggia-3d-engine"
